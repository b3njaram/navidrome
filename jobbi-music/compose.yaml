services:
  jobbi-music:
    build: .
    container_name: jobbi-music
    restart: unless-stopped
    ports:
      - "3131:3131"
    environment:
      PORT: "3131"
      NODE_ENV: production
      PUBLIC_HTTPS: ${PUBLIC_HTTPS:-false}
      NAVIDROME_URL: ${NAVIDROME_URL:?Set NAVIDROME_URL in .env}
      DOWNLOADER_URL: ${DOWNLOADER_URL:?Set DOWNLOADER_URL in .env}
      SLSKD_URL: ${SLSKD_URL:-}
      SLSKD_API_KEY: ${SLSKD_API_KEY:-}
      ADMIN_USERS: ${ADMIN_USERS:?Set ADMIN_USERS in .env}
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - jobbi-storage-stats:/run/jobbi-stats:ro
    cap_drop:
      - ALL
    pids_limit: 128

  jobbi-storage-agent:
    image: node:22-alpine
    container_name: jobbi-storage-agent
    restart: unless-stopped
    network_mode: none
    user: "0:0"
    command: ["node", "/agent/storage-agent.js"]
    environment:
      MUSIC_ROOT: /music
      STORAGE_OUTPUT: /stats/storage.json
      STORAGE_INTERVAL_MS: "1800000"
    volumes:
      - /volume1/music:/music:ro
      - ./server/storage-agent.js:/agent/storage-agent.js:ro
      - jobbi-storage-stats:/stats:rw
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m

volumes:
  jobbi-storage-stats: {}

