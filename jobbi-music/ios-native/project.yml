name: JobbiMusic
options:
  bundleIdPrefix: com.jobbisoft
  deploymentTarget:
    iOS: "26.1"
  xcodeVersion: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    CODE_SIGN_STYLE: Automatic
targets:
  JobbiMusic:
    type: application
    platform: iOS
    sources:
      - path: JobbiMusic
    preBuildScripts:
      - name: Render native Jobbi Music icon
        script: |
          set -e
          python3 "$SRCROOT/scripts/generate-app-icon.py" "$SRCROOT/JobbiMusic/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        basedOnDependencyAnalysis: false
    info:
      path: JobbiMusic/Info.plist
      properties:
        CFBundleDisplayName: Jobbi Music
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobbisoft.jobbi.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Jobbi Music
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "3"
  JobbiMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JobbiMusicTests
    dependencies:
      - target: JobbiMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jobbisoft.jobbi.music.tests
schemes:
  JobbiMusic:
    build:
      targets:
        JobbiMusic: all
    test:
      targets:
        - JobbiMusicTests
    archive:
      targets:
        JobbiMusic: all
