name: Build native Material 3 Jobbi Music APK
on:
  push:
    branches: [main, feature/native-community-discovery-admin-20261110]
    paths:
      - 'jobbi-music/android-native/**'
      - '.github/workflows/jobbi-native-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jobbi-music/android-native/**'
      - '.github/workflows/jobbi-native-android.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jobbi-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform 36
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Keep debug signing key stable across test APKs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jobbi-music-native-debug-signing-v1
      - name: Run unit tests and assemble genuine native APK
        run: gradle --no-daemon -p jobbi-music/android-native :app:testDebugUnitTest :app:assembleDebug
      - name: Verify package and checksum
        shell: bash
        run: |
          test -s jobbi-music/android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum jobbi-music/android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify downloadable playlist exporter
        run: |
          node --check jobbi-music/tools/jobbi-collection-export.user.js
          cmp jobbi-music/tools/jobbi-collection-export.user.js jobbi-music/public/tools/jobbi-collection-export.user.js
      - name: Upload free Spotify and Apple Music exporter
        uses: actions/upload-artifact@v4
        with:
          name: Jobbi-Music-Spotify-Apple-Exporter
          path: |
            jobbi-music/tools/jobbi-collection-export.user.js
            jobbi-music/tools/README.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Jobbi-Music-Native-Material3-APK
          path: jobbi-music/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Real emulator checks: verifies Android screens and gallery conversion in
  # addition to the JVM suite above. Still not a substitute for a live NAS test.
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable hardware acceleration for emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo "::error::KVM is not available on the GitHub runner"; exit 1; fi
      - name: Run native login and picture processing tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: gradle --no-daemon -p jobbi-music/android-native :app:connectedDebugAndroidTest
      - name: Upload Android instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jobbi-Native-Emulator-Test-Results
          path: |
            jobbi-music/android-native/app/build/reports/androidTests/
            jobbi-music/android-native/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
