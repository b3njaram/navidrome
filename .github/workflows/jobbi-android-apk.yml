name: Build Jobbi Music Android APK

on:
  push:
    branches: [feature/jobbi-music-preview]
    paths:
      - 'jobbi-music/android/**'
      - 'jobbi-music/src/**'
      - '.github/workflows/jobbi-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installable APK
        run: gradle --no-daemon -p jobbi-music/android :app:assembleDebug
      - name: APK checksum
        run: sha256sum jobbi-music/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Jobbi-Music-Android-APK
          path: jobbi-music/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
