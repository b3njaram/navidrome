name: Jobbi Music preview build
on:
  push:
    branches: [main, feature/jobbi-music-preview]
    paths:
      - 'jobbi-music/**'
      - '.github/workflows/jobbi-music-build.yml'
  pull_request:
    paths:
      - 'jobbi-music/**'
      - '.github/workflows/jobbi-music-build.yml'
concurrency:
  group: jobbi-music-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobbi_social
          POSTGRES_USER: jobbi_social
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobbi_social -d jobbi_social"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      SOCIAL_TEST_DATABASE_URL: postgresql://jobbi_social:test-only-password@127.0.0.1:5432/jobbi_social
    defaults:
      run:
        working-directory: jobbi-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: sh -n scripts/nas-security-audit.sh
      - run: sh -n scripts/nas-auto-deploy.sh
      - run: sh -n scripts/nas-go-live.sh
      - run: node --check scripts/cloudflare-cutover.mjs
      - run: sh -n scripts/enable-social.sh
      - run: SOCIAL_DB_PASSWORD=ci-only-secret ADMIN_USERS=ci-admin NAVIDROME_URL=http://127.0.0.1:4533 DOWNLOADER_URL=http://127.0.0.1:8383 docker compose -f compose.yaml config --quiet
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: docker build -t jobbi-music:ci .
      - name: Verify production Docker serves actual userscript, never HTML
        run: |
          set -eu
          docker run --rm -d --name jobbi-userscript-test -p 127.0.0.1:31992:3131 jobbi-music:ci
          trap 'docker rm -f jobbi-userscript-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:31992/tools/jobbi-collection-export.user.js -o /tmp/jobbi-userscript.user.js; then break; fi
            sleep 1
          done
          test -s /tmp/jobbi-userscript.user.js
          head -n 1 /tmp/jobbi-userscript.user.js | grep -Fqx '// ==UserScript=='
          grep -Fq '@name         Jobbi Music' /tmp/jobbi-userscript.user.js
          grep -Fq '@match        https://music.apple.com/*' /tmp/jobbi-userscript.user.js
          if grep -iq '<!doctype html>' /tmp/jobbi-userscript.user.js; then exit 1; fi
          curl -fsSI http://127.0.0.1:31992/tools/jobbi-collection-export.user.js |
            grep -iq '^content-type:.*javascript'

  browser-smoke:
    runs-on: ubuntu-latest
    # Official Playwright image ships Chromium, WebKit and their OS dependencies.
    # Avoid Ubuntu apt installation hangs on hosted runners.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults:
      run:
        working-directory: jobbi-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: HOME=/root npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jobbi-browser-failures
          path: jobbi-music/test-results
          retention-days: 7
