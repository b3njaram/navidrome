name: Jobbi Music preview build
on:
  push:
    branches: [main, feature/jobbi-music-preview]
    paths:
      - 'jobbi-music/**'
      - '.github/workflows/jobbi-music-build.yml'
  pull_request:
    paths:
      - 'jobbi-music/**'
      - '.github/workflows/jobbi-music-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobbi-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: sh -n scripts/nas-security-audit.sh
      - run: ADMIN_USERS=ci-admin NAVIDROME_URL=http://127.0.0.1:4533 DOWNLOADER_URL=http://127.0.0.1:8383 docker compose -f compose.yaml config --quiet
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: docker build -t jobbi-music:ci .

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobbi-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jobbi-browser-failures
          path: jobbi-music/test-results
          retention-days: 7
