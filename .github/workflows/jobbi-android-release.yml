name: Publish signed Jobbi Music Android release
on:
  push:
    tags:
      - 'android-v*'
permissions:
  contents: write

jobs:
  signed-android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate official Android version tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          EXPECTED="${TAG#android-v}"
          grep -F "versionName '$EXPECTED'" jobbi-music/android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare private release signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > jobbi-music/android/app/release-signing.jks
          chmod 600 jobbi-music/android/app/release-signing.jks
      - name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PATH: release-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p jobbi-music/android :app:assembleRelease
      - name: Publish verified release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=jobbi-music/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          TAG="$GITHUB_REF_NAME"
          cp "$APK" "Jobbi-Music-$TAG.apk"
          sha256sum "Jobbi-Music-$TAG.apk" > "Jobbi-Music-$TAG.sha256"
          gh release create "$TAG"             "Jobbi-Music-$TAG.apk#Jobbi Music Android APK"             "Jobbi-Music-$TAG.sha256#SHA-256 checksum"             --title "Jobbi Music Android ${TAG#android-v}"             --notes "Signed Android update. Download from this official release. Existing Navidrome music and NAS library remain untouched."
      - name: Remove release keystore file
        if: always()
        run: rm -f jobbi-music/android/app/release-signing.jks
