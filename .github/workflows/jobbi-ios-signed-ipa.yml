name: Export signed Jobbi Music IPA
on: workflow_dispatch
permissions:
  contents: read
jobs:
  signed:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PROFILE_NAME: ${{ secrets.APPLE_PROFILE_NAME }}
      APPLE_EXPORT_METHOD: ${{ vars.APPLE_EXPORT_METHOD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify private Apple signing credentials
        run: |
          test -n "$APPLE_CERT_P12_BASE64" && test -n "$APPLE_CERT_PASSWORD" &&
          test -n "$APPLE_PROFILE_BASE64" && test -n "$APPLE_TEAM_ID" &&
          test -n "$APPLE_PROFILE_NAME" ||
          { echo "::error::Configure all five Apple signing GitHub Secrets"; exit 1; }
      - name: Generate project
        working-directory: jobbi-music/ios-native
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Import certificate and provisioning profile
        run: |
          set -euo pipefail
          export KEYCHAIN="$RUNNER_TEMP/jobbi-signing.keychain-db"
          export KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROFILE_BASE64" | base64 -D > "$HOME/Library/MobileDevice/Provisioning Profiles/Jobbi.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Export signed IPA
        working-directory: jobbi-music/ios-native
        run: |
          set -euo pipefail
          method="$APPLE_EXPORT_METHOD"
          if [ -z "$method" ]; then method=ad-hoc; fi
          case "$method" in ad-hoc|development) ;; *) exit 1;; esac
          identity="Apple Distribution"
          if [ "$method" = development ]; then identity="Apple Development"; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>$method</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>com.jobbisoft.jobbi.music</key><string>$APPLE_PROFILE_NAME</string>
          </dict></dict></plist>
          EOF
          xcodebuild -project JobbiMusic.xcodeproj -scheme JobbiMusic \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JobbiMusic.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$APPLE_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$identity" archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/JobbiMusic.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/JobbiMusic-SIGNED.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: JobbiMusic-SIGNED-IPA
          path: JobbiMusic-SIGNED.ipa
          if-no-files-found: error
          retention-days: 15
      - name: Destroy temporary signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/jobbi-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/ExportOptions.plist" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/Jobbi.mobileprovision"
